name: workload-identity-demo

# Demonstrates GitHub Actions OIDC → Microsoft Entra ID via federated credential. No secret stored.
# The federated credential and repo secrets (AZURE_TENANT_ID, AZURE_CLIENT_ID, FTGO_RESTAURANTS_SCOPE)
# are provisioned by scripts/provision-apps.sh.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  acquire-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: demo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Azure login (federated)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      - name: Acquire access token for Restaurants API
        run: |
          token=$(az account get-access-token \
            --resource "${{ secrets.FTGO_RESTAURANTS_SCOPE }}" \
            --query "accessToken" -o tsv)
          echo "Acquired token of length ${#token} (never echo a real token in CI logs)"
