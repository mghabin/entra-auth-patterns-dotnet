name: workload-identity-demo

# Demonstrates GitHub Actions OIDC → Microsoft Entra ID via a federated
# credential. Run manually after you've created the federated credential
# on the ftgo-deliveryservice app registration with subject:
#
#   repo:mghabin/entra-auth-patterns-dotnet:ref:refs/heads/main
#
# and configured the following repo secrets:
#
#   AZURE_TENANT_ID            — the Entra tenant containing the app
#   AZURE_CLIENT_ID            — ftgo-deliveryservice app (client) ID
#   FTGO_RESTAURANTS_SCOPE     — e.g. api://<restaurantservice-id>/.default
#
# No client secret is stored anywhere.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  acquire-token:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (federated)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      - name: Acquire access token for RestaurantService
        run: |
          token=$(az account get-access-token \
            --resource "${{ secrets.FTGO_RESTAURANTS_SCOPE }}" \
            --query "accessToken" -o tsv)
          echo "Acquired token of length ${#token} (never echo a real token in CI logs)"
