# Cloud CD pipeline: builds the FTGO service images, pushes to GHCR, and deploys.
#
# TRIGGERS:
#   - push to main         → build + deploy-ci only
#   - workflow_dispatch    → build + deploy through to chosen env:
#         environment=ci    → ci
#         environment=ppe   → ci → ppe
#         environment=prod  → ci → ppe → prod  (requires reviewer on prod environment)
#
# ppe and prod NEVER run on push — they require an explicit dispatch with the env input.
#
# Per-env deploy logic lives in the reusable workflow .github/workflows/deploy-env.yml
# so ci/ppe/prod stay in lock-step. To change deploy behaviour for ALL envs,
# edit deploy-env.yml once.
#
# Environment GitHub vars expected per env: AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID
# Repo-level secret expected: AZURE_TENANT_ID
# Bootstrap with scripts/bootstrap-env.sh ENV=<env>.
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (ci|ppe|prod). Defaults to full ci→ppe→prod chain.
        required: false
        default: ci
        type: choice
        options: [ci, ppe, prod]
      imageTag:
        description: Existing image tag (e.g. sha-abc1234) to redeploy. Leave blank to build a fresh one from HEAD.
        required: false
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-images:
    if: github.event_name == 'push' || github.event.inputs.imageTag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project:
          - Ftgo.ApiGateway
          - Ftgo.Orders.Api
          - Ftgo.Restaurants.Api
          - Ftgo.Kitchen.Worker
    outputs:
      imageTag: ${{ steps.meta.outputs.imageTag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          PROJECT="${{ matrix.project }}"
          # Strip "Ftgo." prefix and lowercase, replacing dots with hyphens (e.g.
          # "Ftgo.Orders.Api" → "orders-api"). The image tag mirrors the ACA shortName.
          SHORT_NAME="${PROJECT#Ftgo.}"
          SHORT_NAME="${SHORT_NAME//./-}"
          SHORT_NAME="${SHORT_NAME,,}"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "SHORT_NAME=${SHORT_NAME}"
            echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}"
            echo "imageTag=sha-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.project }}
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: true
          # SLSA build-provenance attestation — written into the registry alongside the image.
          # Verifiable with `cosign verify-attestation` or `gh attestation verify`.
          provenance: mode=max
          # SBOM in SPDX format, also pushed to the registry.
          sbom: true
          build-args: |
            PROJECT=${{ matrix.project }}
            BUILD_GIT_SHA=${{ github.sha }}
            BUILD_VERSION=0.0.0-sha-${{ steps.meta.outputs.SHORT_SHA }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.BUILD_TIMESTAMP }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ftgo-${{ steps.meta.outputs.SHORT_NAME }}:sha-${{ steps.meta.outputs.SHORT_SHA }}
            ghcr.io/${{ github.repository_owner }}/ftgo-${{ steps.meta.outputs.SHORT_NAME }}:latest
          cache-from: type=gha,scope=ftgo-${{ steps.meta.outputs.SHORT_NAME }}
          cache-to: type=gha,scope=ftgo-${{ steps.meta.outputs.SHORT_NAME }},mode=max

      # Cryptographically signed provenance attestation, pushed to the GitHub
      # attestation store + Sigstore transparency log. Verifies who built the
      # image, on which commit, with which workflow.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ftgo-${{ steps.meta.outputs.SHORT_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Vulnerability scan of the freshly-pushed image. Fails the build on
      # CRITICAL/HIGH OS-package or library findings so we don't ship known
      # vulnerable images to ACA. Results are also uploaded to the GitHub
      # security tab as SARIF.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (post-supply-chain-compromise; GHSA-69fq-xp46-6x23 affected ≤0.32.0)
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ftgo-${{ steps.meta.outputs.SHORT_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ steps.meta.outputs.SHORT_NAME }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-${{ steps.meta.outputs.SHORT_NAME }}.sarif
          category: trivy-${{ steps.meta.outputs.SHORT_NAME }}

  resolve-image-tag:
    # Resolve image tag once and pass it to all downstream env deploys.
    # When workflow_dispatch with imageTag input is used, build-images is skipped.
    needs: build-images
    if: |
      always() &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      imageTag: ${{ steps.tag.outputs.imageTag }}
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.imageTag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ needs.build-images.outputs.imageTag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "imageTag=${TAG}" >> "$GITHUB_OUTPUT"

  deploy-ci:
    needs: resolve-image-tag
    if: |
      always() && needs.resolve-image-tag.result == 'success' &&
      (github.event_name == 'push' ||
       github.event.inputs.environment == 'ci' ||
       github.event.inputs.environment == 'ppe' ||
       github.event.inputs.environment == 'prod')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: ci
      image_tag: ${{ needs.resolve-image-tag.outputs.imageTag }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  deploy-ppe:
    needs: [resolve-image-tag, deploy-ci]
    if: |
      always() && needs.deploy-ci.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.environment == 'ppe' ||
       github.event.inputs.environment == 'prod')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: ppe
      image_tag: ${{ needs.resolve-image-tag.outputs.imageTag }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  deploy-prod:
    needs: [resolve-image-tag, deploy-ppe]
    if: |
      always() && needs.deploy-ppe.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      image_tag: ${{ needs.resolve-image-tag.outputs.imageTag }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
