name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EntraAuthPatterns.slnx --locked-mode

      - name: Build
        run: dotnet build EntraAuthPatterns.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EntraAuthPatterns.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: ./TestResults/**/coverage.cobertura.xml
          format: markdown
          output: both
          badge: true
          hide_complexity: true
          thresholds: '50 75'

      - name: Append coverage to step summary
        if: always() && hashFiles('code-coverage-results.md') != ''
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"


      - name: Format check
        run: dotnet format EntraAuthPatterns.slnx --verify-no-changes --no-restore --severity warn

  # Blocks PRs that introduce known-vulnerable dependencies (NuGet + Actions).
  # Free for public repos; uses GitHub's advisory database.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  bicep-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Bicep CLI
        run: az bicep install

      - name: Bicep build (templates + modules) — fail on any warning
        # az bicep build runs the linter using infra/bicep/bicepconfig.json.
        # We tee stderr+stdout, then fail if any "Warning" or "Error" line slipped through
        # (ARM build itself only fails on errors, but our bicepconfig has strict rules
        # that emit warnings — those should block CI).
        run: |
          set -euo pipefail
          mkdir -p /tmp/bicep-out
          fail=0
          for f in infra/bicep/main.bicep infra/bicep/azure.bicep infra/bicep/bootstrap.bicep infra/bicep/modules/*.bicep; do
            echo "::group::bicep build $f"
            out=$(az bicep build --file "$f" --outdir /tmp/bicep-out 2>&1 || true)
            echo "$out"
            echo "::endgroup::"
            if echo "$out" | grep -E ' : (Warning|Error) ' >/dev/null; then
              echo "::error file=$f::bicep lint warning/error in $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::bicep lint failures found — see grouped output above"
            exit 1
          fi
          echo "All bicep templates + modules built clean (zero warnings)."

      - name: Bicep build-params
        env:
          AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000000
          GH_OWNER:        mghabin
          GH_REPO:         entra-auth-patterns-dotnet
        run: |
          set -euo pipefail
          fail=0
          for env in dev ppe prod; do
            for stem in main bootstrap azure; do
              file="infra/bicep/${stem}.${env}.bicepparam"
              [ -f "$file" ] || continue
              echo "::group::bicep build-params $file"
              out=$(az bicep build-params --file "$file" --outfile "/tmp/bicep-out/${stem}.${env}.parameters.json" 2>&1 || true)
              echo "$out"
              echo "::endgroup::"
              if echo "$out" | grep -E ' : (Warning|Error) ' >/dev/null; then
                echo "::error file=$file::bicep lint warning/error in $file"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All bicepparam files compiled clean (zero warnings)."

  # Lints all .github/workflows/*.yml with actionlint + shellcheck. Catches
  # busted ${{ }} expressions, wrong runner labels, missing ids, broken
  # matrix references, shellcheck violations in `run:` blocks, etc. before
  # they merge.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # Scan for accidentally committed secrets on every PR + push to main.
  # gitleaks ships a default ruleset (AWS keys, GitHub tokens, Azure conn
  # strings, JWT-shaped values, etc.). The repo-root .gitleaks.toml
  # allowlists known false positives (Azure built-in RBAC role GUIDs).
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
