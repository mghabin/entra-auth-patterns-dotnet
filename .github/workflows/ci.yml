name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EntraAuthPatterns.slnx --locked-mode

      - name: Build
        run: dotnet build EntraAuthPatterns.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EntraAuthPatterns.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Format check
        run: dotnet format EntraAuthPatterns.slnx --verify-no-changes --no-restore --severity warn

  bicep-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bicep CLI
        run: az bicep install

      - name: Bicep build (lints templates)
        run: |
          az bicep build --file infra/bicep/main.bicep --outdir /tmp/bicep-out
          echo "main.bicep + modules built clean"

      - name: Bicep build-params
        env:
          AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000000
        run: |
          az bicep build-params --file infra/bicep/main.bicepparam --outfile /tmp/bicep-out/main.parameters.json
          echo "main.bicepparam compiled clean"
