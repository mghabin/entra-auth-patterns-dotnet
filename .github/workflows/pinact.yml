name: pinact

# Validate every 3rd-party GitHub Action is pinned to a commit SHA (not a mutable tag).
# Tool: https://github.com/suzuki-shunsuke/pinact

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  pinact:
    name: pinact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: "true"
          pinact_opts: --check --verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
