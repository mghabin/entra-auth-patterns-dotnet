# GitHub Repository Rulesets — successor to classic branch-protection.
#
# Why rulesets over classic branch protection:
#   * Modern GitHub API (the classic /branches/{branch}/protection endpoint is in
#     soft-deprecation; rulesets are the documented forward path).
#   * Work with the default GITHUB_TOKEN (when granted `administration: write`),
#     so no fine-grained PAT to provision/rotate (was BRANCH_PROTECTION_TOKEN).
#   * Ruleset JSON shape matches the API response, so drift detection is a
#     trivial deep-equal instead of a 30-line jq projection.
#
# Source of truth: .github/rulesets/*.json (one ruleset per file).

name: repo-rulesets

on:
  workflow_dispatch:
    inputs:
      ruleset:
        description: 'Ruleset filename under .github/rulesets/ (without .json) to apply'
        type: string
        default: main
  schedule:
    # Daily drift report at 04:00 UTC. Read-only; never auto-applies.
    - cron: '0 4 * * *'

permissions:
  contents: read
  # `administration: write` is required to upsert rulesets via /repos/{owner}/{repo}/rulesets.
  # The drift job downgrades to `administration: read` at job-level scope.
  administration: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Upsert ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RULESET: ${{ inputs.ruleset }}
        run: |
          set -euo pipefail
          FILE=".github/rulesets/${RULESET}.json"
          if [[ ! -f "$FILE" ]]; then
            echo "::error::No ruleset found at $FILE"
            exit 1
          fi
          PAYLOAD=$(jq 'del(._comment)' "$FILE")
          NAME=$(jq -r '.name' <<<"$PAYLOAD")

          echo "Looking up existing ruleset by name '${NAME}'…"
          ID=$(gh api "repos/${REPO}/rulesets" --jq ".[] | select(.name==\"${NAME}\") | .id" | head -1)

          if [[ -n "$ID" ]]; then
            echo "Updating ruleset id=${ID}"
            echo "$PAYLOAD" | gh api -X PUT "repos/${REPO}/rulesets/${ID}" --input -
          else
            echo "Creating new ruleset"
            echo "$PAYLOAD" | gh api -X POST "repos/${REPO}/rulesets" --input -
          fi

  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Diff live rulesets vs committed JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(.github/rulesets/*.json)
          if [[ ${#configs[@]} -eq 0 ]]; then
            echo "No ruleset configs found — nothing to diff."
            exit 0
          fi

          # Strip API-only fields that the server adds on read so they don't show
          # up as drift. Everything else is part of the user-authored shape.
          STRIP_FIELDS='del(.id, .source_type, .source, .node_id, .created_at, .updated_at, .current_user_can_bypass, ._links, .links)'

          drift=0
          for f in "${configs[@]}"; do
            name=$(jq -r '.name' "$f")
            echo "::group::Diffing ruleset '${name}'"
            expected=$(jq "del(._comment) | ${STRIP_FIELDS}" "$f" | jq -S .)

            id=$(gh api "repos/${REPO}/rulesets" --jq ".[] | select(.name==\"${name}\") | .id" | head -1)
            if [[ -z "$id" ]]; then
              echo "::warning::Ruleset '${name}' is not provisioned on the repo"
              drift=1
              echo "::endgroup::"
              continue
            fi

            live=$(gh api "repos/${REPO}/rulesets/${id}" | jq "${STRIP_FIELDS}" | jq -S .)

            if [[ "$expected" != "$live" ]]; then
              drift=1
              echo "::warning::Ruleset drift on '${name}'"
              diff <(echo "$expected") <(echo "$live") || true
            else
              echo "✓ ruleset '${name}' matches committed config"
            fi
            echo "::endgroup::"
          done

          if [[ $drift -eq 1 ]]; then
            echo "::error::Drift detected — re-run the apply job (workflow_dispatch) to reconcile."
            exit 1
          fi
