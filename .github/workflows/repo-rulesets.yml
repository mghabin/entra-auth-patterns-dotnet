# GitHub Repository Rulesets — drift detection only.
#
# Why drift-only and not auto-apply:
#   The default GITHUB_TOKEN cannot manage repository administration
#   (`administration` is not exposed as a workflow permission scope), so
#   any "apply ruleset" job would need an admin PAT or GitHub App. We
#   prefer keeping CI free of admin secrets and applying changes via a
#   maintainer's local `gh` session (see README/operations.md).
#
# Read access (GET /repos/{owner}/{repo}/rulesets) does work with the
# default token, which is all we need to detect drift.
#
# Source of truth: .github/rulesets/*.json (one ruleset per file).
# Apply manually:
#   ID=$(gh api repos/$REPO/rulesets --jq '.[]|select(.name=="NAME")|.id')
#   jq 'del(._comment)' .github/rulesets/main.json \
#     | gh api -X PUT repos/$REPO/rulesets/$ID --input -

name: repo-rulesets

on:
  workflow_dispatch: {}
  schedule:
    # Daily drift report at 04:00 UTC.
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - '.github/rulesets/**'
      - '.github/workflows/repo-rulesets.yml'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Diff live rulesets vs committed JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(.github/rulesets/*.json)
          if [[ ${#configs[@]} -eq 0 ]]; then
            echo "No ruleset configs found — nothing to diff."
            exit 0
          fi

          # Strip API-only fields that the server adds on read so they don't
          # show up as drift. Everything else is part of the user-authored shape.
          # `bypass_actors` is also stripped because the default GITHUB_TOKEN does
          # not have permission to read it (it requires repo-admin scope), so the
          # API returns it as missing/null in CI even when it's set on the live
          # ruleset. The committed file still records the intended bypass actors
          # for documentation; verify them out-of-band with an admin PAT.
          STRIP='del(.id, .source_type, .source, .node_id, .created_at, .updated_at, .current_user_can_bypass, ._links, .links, .bypass_actors)'
          # Optional fields that the API may or may not return when empty.
          # Normalize both sides to "field absent if empty" so they compare
          # equal regardless of which shape the API happens to use.
          NORMALIZE='.'

          drift=0
          for f in "${configs[@]}"; do
            name=$(jq -r '.name' "$f")
            echo "::group::Diffing ruleset '${name}'"
            expected=$(jq "del(._comment) | ${STRIP} | ${NORMALIZE}" "$f" | jq -S .)

            id=$(gh api "repos/${REPO}/rulesets" --jq ".[] | select(.name==\"${name}\") | .id" | head -1)
            if [[ -z "$id" ]]; then
              echo "::warning::Ruleset '${name}' is not provisioned on the repo. Apply it manually with the snippet in repo-rulesets.yml header."
              drift=1
              echo "::endgroup::"
              continue
            fi

            live=$(gh api "repos/${REPO}/rulesets/${id}" | jq "${STRIP} | ${NORMALIZE}" | jq -S .)

            if [[ "$expected" != "$live" ]]; then
              drift=1
              echo "::warning::Ruleset drift on '${name}'"
              diff <(echo "$expected") <(echo "$live") || true
            else
              echo "✓ ruleset '${name}' matches committed config"
            fi
            echo "::endgroup::"
          done

          if [[ $drift -eq 1 ]]; then
            echo "::error::Drift detected — apply manually (see header of this workflow file)."
            exit 1
          fi
