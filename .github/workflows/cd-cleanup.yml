# Cloud env safety net: nightly scale ci/ppe container apps to min=0/max=3 so a misconfigured
# bicepparam (or manual `az` poke) can't keep instances pinned overnight and rack up bills.
# Idempotent. Skips prod intentionally.
name: cd-cleanup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-down:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Per-matrix-env GitHub Environment so each iteration uses its own
    # AZURE_CLIENT_ID / AZURE_SUBSCRIPTION_ID vars + secrets. Without this,
    # both ci and ppe would resolve from whatever single environment was
    # hard-coded here, defeating the per-env credential separation that
    # the rest of CD relies on.
    environment: ${{ matrix.env }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env: [ci, ppe]
    steps:
      - name: Skip if tier never bootstrapped
        id: precheck
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [ -z "${AZURE_CLIENT_ID}" ]; then
            echo "::notice title=Cleanup skipped (${{ matrix.env }})::AZURE_CLIENT_ID not set on this GitHub Environment; tier never bootstrapped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.precheck.outputs.skip == 'false'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - if: steps.precheck.outputs.skip == 'false'
        name: Reset min/max replicas in rg-ftgo-${{ matrix.env }}-${{ vars.LOCATION || 'eastus' }}
        env:
          LOCATION: ${{ vars.LOCATION || 'eastus' }}
        run: |
          set -euo pipefail
          RG="rg-ftgo-${{ matrix.env }}-${LOCATION}"
          if ! az group show --name "$RG" --only-show-errors --output none 2>/dev/null; then
            echo "Resource group $RG does not exist — skipping."
            exit 0
          fi
          APPS=$(az containerapp list --resource-group "$RG" --query '[].name' -o tsv --only-show-errors)
          if [ -z "$APPS" ]; then
            echo "No container apps in $RG — skipping."
            exit 0
          fi
          for app in $APPS; do
            echo "Scaling $app → min=0 max=3"
            az containerapp update \
              --name "$app" \
              --resource-group "$RG" \
              --min-replicas 0 \
              --max-replicas 3 \
              --only-show-errors \
              --output none
          done
